<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do-List</title>
</head>
<body>
    <dialog class="addproject">
        <button>X</button>
        <form method="dialog">
            <label for="pname">New Project:</label>
            <input type="text" id="pname" name="pname" required>

            <button type="submit">Add</button>
        </form>
    </dialog>
    <dialog class="renameproject">
        <button>X</button>
        <form method="dialog">
            <label for="rname">New name:</label>
            <input type="text" id="rname" name="rname" required>

            <button type="submit">Rename</button>
        </form>
    </dialog>
    <aside class="sidebar">
        <header class="heading">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>check-circle</title><path d="M12 2C6.5 2 2 6.5 2 12S6.5 22 12 22 22 17.5 22 12 17.5 2 12 2M10 17L5 12L6.41 10.59L10 14.17L17.59 6.58L19 8L10 17Z" /></svg>
            <h1>TodoList</h1>
        </header>
        <section class="projects">
            <div class="title">
                <h2>Projects</h2>
                <button><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><title>Add projects</title><path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" /></svg></button>
            </div>
            <div class="pcontainer"></div>
        </section>
    </aside>
    <main>
        <header> 
            <div class="hpinfo"></div>
            <div class="addtask"></div>
        </header>
        <section class="taskcontainer">
            <h2>Tasks</h2>
            <div class="taskcard">
                <input type="checkbox" class="taskcheckbox">
                <h3>Buy Groceries</h3>
            </div>
            <div class="taskcard">
                <input type="checkbox" class="taskcheckbox">
                <h3>Workout</h3>
            </div>
        </section>
        <section class="completedcontainer">
            <h2>Completed</h2>
        </section>
    </main>
</body>
</html>
